<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" font-family="Segoe UI, system-ui, sans-serif"><title>Statuts selon la part du budget du jour</title><rect width="880" height="120" rx="16" fill="#faf9f5"/><rect x="24" y="22" width="156" height="76" rx="12" fill="#2e8b57"/><text x="38" y="52" font-size="17" font-weight="700" fill="#fff">● VERT</text><text x="38" y="80" font-size="13" fill="#fff">< 60 % du budget</text><rect x="192" y="22" width="156" height="76" rx="12" fill="#b8860b"/><text x="206" y="52" font-size="17" font-weight="700" fill="#fff">◐ JAUNE</text><text x="206" y="80" font-size="13" fill="#fff">60–80 % du budget</text><rect x="360" y="22" width="156" height="76" rx="12" fill="#d2691e"/><text x="374" y="52" font-size="17" font-weight="700" fill="#fff">▲ ORANGE</text><text x="374" y="80" font-size="13" fill="#fff">80–100 % du budget</text><rect x="528" y="22" width="156" height="76" rx="12" fill="#c7362f"/><text x="542" y="52" font-size="17" font-weight="700" fill="#fff">■ ROUGE</text><text x="542" y="80" font-size="13" fill="#fff">> 100 % du budget</text><rect x="696" y="22" width="156" height="76" rx="12" fill="#9b1328"/><text x="710" y="52" font-size="17" font-weight="700" fill="#fff">⛔ CRITIQUE</text><text x="710" y="80" font-size="13" fill="#fff">≥ 150 % ou risque du budget</text></svg>